name: Release Axio Family APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_github_release:
        description: 'Publish a GitHub Release with the built APK'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: AxioFamily
  APPLICATION_ID: com.aistudio.axiofamily.xpqrmk
  GRADLE_VERSION: '9.3.1'
  JAVA_VERSION: '21'

jobs:
  release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Android SDK Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_DIR}/licenses"

          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${SDK_DIR}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "${SDK_DIR}/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "${SDK_DIR}/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81" > "${SDK_DIR}/licenses/android-googlexr-license"
          printf "\n859f317696f67ef3d7f30a50a5560e7834b43903" > "${SDK_DIR}/licenses/android-sdk-arm-dbt-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "${SDK_DIR}/licenses/google-gdk-license"
          printf "\n3a7848b1d7366ca5cfa0be477627644ca73f47e3" > "${SDK_DIR}/licenses/microxr-sysimage-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d" > "${SDK_DIR}/licenses/mips-android-sysimage-license"

          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Android SDK licenses configured in ${SDK_DIR}/licenses"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Determine Release Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.version_tag }}" ]]; then
            RAW_TAG="${{ inputs.version_tag }}"
          else
            RAW_TAG="v1.0.${{ github.run_number }}"
          fi
          if [[ "${RAW_TAG}" != v* ]]; then
            RAW_TAG="v${RAW_TAG}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${CLEAN_VERSION} (tag: ${RAW_TAG})"

      - name: Restore Debug Keystore & Prepare Release Signing Keystore
        id: keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY_STORE_BASE64 || secrets.KEYSTORE }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEY_ALIAS_PASSWORD }}
        run: |
          # 1. Ensure debug.keystore exists (since debug.keystore is gitignored and stored as debug.keystore.base64)
          if [[ ! -f "${GITHUB_WORKSPACE}/debug.keystore" && -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            tr -d '[:space:]' < "${GITHUB_WORKSPACE}/debug.keystore.base64" | base64 --decode > "${GITHUB_WORKSPACE}/debug.keystore"
          fi

          # 2. Prepare release keystore expected by app/build.gradle.kts (alias: upload)
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          rm -f "${KEYSTORE_FILE}"
          KEYSTORE_READY="false"

          if [[ -n "${SECRET_KEYSTORE_B64}" && -n "${SECRET_STORE_PASS}" ]]; then
            echo "Attempting to decode custom release keystore from GitHub Secrets..."
            if echo "${SECRET_KEYSTORE_B64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE_FILE}" 2>/dev/null; then
              if keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${SECRET_STORE_PASS}" >/dev/null 2>&1; then
                RESOLVED_STORE_PASSWORD="${SECRET_STORE_PASS}"
                RESOLVED_KEY_PASSWORD="${SECRET_KEY_PASS:-$SECRET_STORE_PASS}"

                if ! keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${RESOLVED_STORE_PASSWORD}" -alias upload >/dev/null 2>&1; then
                  SOURCE_ALIAS="${SECRET_KEY_ALIAS}"
                  if [[ -z "${SOURCE_ALIAS}" ]]; then
                    SOURCE_ALIAS=$(keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${RESOLVED_STORE_PASSWORD}" \
                      | grep "PrivateKeyEntry" | head -n 1 | cut -d',' -f1 | tr -d '[:space:]')
                  fi
                  if [[ -n "${SOURCE_ALIAS}" ]]; then
                    echo "Mapping keystore alias '${SOURCE_ALIAS}' to 'upload'..."
                    keytool -changealias \
                      -keystore "${KEYSTORE_FILE}" \
                      -storepass "${RESOLVED_STORE_PASSWORD}" \
                      -alias "${SOURCE_ALIAS}" \
                      -destalias "upload" \
                      -keypass "${RESOLVED_KEY_PASSWORD}" || true
                  fi
                fi

                if keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${RESOLVED_STORE_PASSWORD}" -alias upload >/dev/null 2>&1; then
                  KEYSTORE_READY="true"
                  echo "Custom release keystore verified successfully."
                fi
              fi
            fi
          fi

          if [[ "${KEYSTORE_READY}" != "true" && -f "${GITHUB_WORKSPACE}/debug.keystore" ]]; then
            echo "Using provisioned project certificate (from debug.keystore) mapped to 'upload' alias so Firebase Auth SHA-1 matches..."
            cp "${GITHUB_WORKSPACE}/debug.keystore" "${KEYSTORE_FILE}"
            RESOLVED_STORE_PASSWORD="android"
            RESOLVED_KEY_PASSWORD="android"
            keytool -changealias \
              -keystore "${KEYSTORE_FILE}" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -destalias "upload" \
              -keypass "android" || true
            if keytool -list -keystore "${KEYSTORE_FILE}" -storepass "android" -alias upload >/dev/null 2>&1; then
              KEYSTORE_READY="true"
            fi
          fi

          if [[ "${KEYSTORE_READY}" != "true" ]]; then
            echo "Generating self-signed release keystore (alias: upload)..."
            rm -f "${KEYSTORE_FILE}"
            RESOLVED_STORE_PASSWORD="androidrelease"
            RESOLVED_KEY_PASSWORD="androidrelease"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "${RESOLVED_STORE_PASSWORD}" \
              -keypass "${RESOLVED_KEY_PASSWORD}" \
              -dname "CN=Axio Family, OU=Mobile, O=AxioFamily, L=Bengaluru, S=KA, C=IN"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${RESOLVED_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${RESOLVED_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Prepare Environment & Firebase Config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEFAULT_GOOGLE_SERVICES_B64: ""
        run: |
          if [[ ! -f ".env" && -f ".env.example" ]]; then
            cp .env.example .env
          fi

          if [[ -n "${GOOGLE_SERVICES_JSON_SECRET}" ]]; then
            echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            echo "${GOOGLE_SERVICES_JSON_SECRET}" > app/google-services.json
          elif [[ ! -f "app/google-services.json" ]]; then
            echo "Restoring provisioned app/google-services.json for release build..."
            echo "${DEFAULT_GOOGLE_SERVICES_B64}" | base64 --decode > app/google-services.json
          fi

          if [[ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]]; then
            echo "Restoring app/src/main/res/values/firebase_applet_config.xml..."
            mkdir -p app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8" standalone="no"?>\n<resources>\n    <string name="firestore_database_id" translatable="false">ai-studio-android-18b947f5-a54c-4756-8c11-b9c56ee3687f</string>\n</resources>\n' > app/src/main/res/values/firebase_applet_config.xml
          fi

      - name: Build Signed Release APK
        shell: bash
        run: |
          if [[ -f "./gradlew" && -f "gradle/wrapper/gradle-wrapper.jar" ]]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace
          else
            gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Prepare Release APK & SHA-256 Checksum
        id: artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.version.outputs.version }}"

          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [[ -z "${APK_SOURCE}" ]]; then
            echo "Error: Release APK was not found in app/build/outputs/apk/release"
            exit 1
          fi

          APK_DEST="release-assets/${APP_NAME}-v${VERSION}-release.apk"
          cp "${APK_SOURCE}" "${APK_DEST}"
          sha256sum "${APK_DEST}" > "${APK_DEST}.sha256"

          ls -lh release-assets/
          echo "apk_path=${APK_DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}-release
          path: |
            release-assets/*.apk
            release-assets/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.tag }}"
          body: |
            ## ${{ env.APP_NAME }} ${{ steps.version.outputs.tag }}

            ### Highlights
            - **Unified Family Household Budget**: Real-time Firestore synchronization via 6-character Join Code or Email Invite.
            - **Shared & Personal Privacy Scopes**: Switch between Combined, Shared Household, and Private Personal views.
            - **Cashiro Bank SMS Parser Engine (`com.ritesh.parser.core.bank`)**: Automatic on-device parsing for HDFC, SBI, ICICI, Axis, Kotak, Paytm/UPI, and generic bank alerts.
            - **Category Envelopes & Visual Analytics**: Monthly safe daily spend pulse, category progress envelopes, donut breakdown, and 6-month velocity bar chart.

            ### Verification
            Verify the downloaded APK using the attached `.sha256` checksum file.
          files: |
            release-assets/*.apk
            release-assets/*.sha256
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
